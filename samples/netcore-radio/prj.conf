#
# Network-core image configuration. The first block is inherited verbatim
# from the upstream sample this replaces
# (zephyr/samples/boards/nordic/ieee802154/802154_rpmsg/prj.conf) — the
# radio server's behaviour must not change, only gain a second service.

## Disable serial and UART interface.
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n

CONFIG_LOG=n

CONFIG_NRF_802154_SER_RADIO=y

# --- MCUHome additions ------------------------------------------------

# Entropy service. Both symbols already default to y on this board — the
# RNG peripheral node is `status = "okay"` and `zephyr,entropy` points at
# it in dts/arm/nordic/nrf5340_cpunet.dtsi, and CONFIG_ENTROPY_NRF5_RNG
# follows from that. They are spelled out anyway: this image exists to
# hand out that peripheral's output, so a board or SoC change that
# silently dropped the driver must break the build here, not produce a
# radio image that answers every entropy request with an error.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_NRF5_RNG=y

# The entropy endpoint shares the ipc_service instance that already
# carries the 802.15.4 spinel channel (ipc0). CONFIG_IPC_SERVICE and the
# RPMsg backend come from CONFIG_NRF_802154_SER_RADIO; the endpoint
# budget does not need raising, because
# CONFIG_IPC_SERVICE_BACKEND_RPMSG_NUM_ENDPOINTS_PER_INSTANCE defaults to
# 2 and this image uses exactly those two (spinel + entropy). Bluetooth
# is off (ADR 0011), so nothing competes for the second slot.
