#
# Dongle (nRF52840): Thread-only per ADR 0011 (BLE off in v0.1).
# No console — the CDC-ACM console blocks printk without an attached
# host terminal (upstream bug candidate Z5); status via LEDs.

CONFIG_BT=n

CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
# NOTE: the debug-rtt snippet (applied by sample.yaml and the documented
# build command) merges after board files and turns logging back on, over
# RTT instead of CDC-ACM. Build without `-S debug-rtt` to get the silent
# LED-only image this line describes.
CONFIG_LOG=n
