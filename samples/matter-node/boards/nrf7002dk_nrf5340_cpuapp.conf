#
# nRF7002-DK (nRF5340 app core), Thread-only coexistence experiment:
# BLE deliberately OFF — vanilla Zephyr has no combined BLE+802.15.4
# netcore image (no MPSL); the net core runs 802154_rpmsg.
#
# Log-only debug transport: everything (CHIP, OpenThread, printk) flows
# through the deferred log core to the RTT backend. The interactive
# shell-over-RTT was dropped: under OpenThread log load its RX event
# delivery wedges (thread never leaves k_event_wait despite the raised
# transport event) — the Thread dataset is already persisted in flash,
# so runtime CLI access is no longer needed for the E2E test.

CONFIG_BT=n

CONFIG_USE_SEGGER_RTT=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
# Never block logging on a full RTT buffer (a wedged/absent host reader
# must not stall the device)
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# OpenThread stack logging (SRP client / mesh forwarder visibility)
CONFIG_OPENTHREAD_DEBUG=y
CONFIG_OPENTHREAD_LOG_LEVEL_INFO=y

# CHIP at info: errors/progress without the per-report [DMG] debug flood
CONFIG_MATTER_LOG_LEVEL_INF=y

# Entropy: INSECURE prototype PRNG driver (appcore has no upstream TRNG).
# The explicit ALLOW gate is a build barrier: images without it do not
# compile, so the placeholder can never slip into a release unnoticed.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_MCUHOME_ALLOW_INSECURE_ENTROPY=y

# The OT radio workqueue calls into the 802.15.4 spinel serialization on
# nRF53 (netcore radio) — the 512 B default overflows (verified via
# fatal-error breakpoint). Size for the serialized path.
CONFIG_OPENTHREAD_RADIO_WORKQUEUE_STACK_SIZE=4096
