#
# nRF7002-DK (nRF5340 app core), Thread-only coexistence experiment:
# BLE deliberately OFF — vanilla Zephyr has no combined BLE+802.15.4
# netcore image (no MPSL); the net core runs 802154_rpmsg.
#
# The RTT log transport and the nRF53 802.15.4 workqueue sizing are NOT
# here: they come from the snippets this sample is built with
# (`-S debug-rtt` and `-S matter`, see prj.conf). Only board-scoped
# decisions remain below.
#
# (The interactive shell-over-RTT was dropped: under OpenThread log load
# its RX event delivery wedges — the thread never leaves k_event_wait
# despite the raised transport event. The Thread dataset is persisted in
# flash, so runtime CLI access is no longer needed for the E2E test.)

CONFIG_BT=n

# Entropy: the app core has no RNG peripheral, so it seeds a CTR-DRBG
# from the network core's over IPC (drivers/entropy/, board overlay picks
# the node). CONFIG_MCUHOME_ENTROPY_IPC follows from the devicetree node
# — hardware in DTS, never in Kconfig — and the driver pulls in
# CONFIG_MBEDTLS_CTR_DRBG_C itself. Only the subsystem switch is needed
# here.
#
# The network core must run mcuhome/samples/netcore-radio: the upstream
# 802154_rpmsg image has the radio server but not the entropy service,
# and a node built against it never gets seeded (loud -EIO, no silent
# downgrade — see snippets/matter/matter.conf).
CONFIG_ENTROPY_GENERATOR=y
