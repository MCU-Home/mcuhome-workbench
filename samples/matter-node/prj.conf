# Common configuration; board-specific pieces live in boards/<board>.conf.

CONFIG_CHIP=y
CONFIG_STD_CPP17=y

# Stay on picolibc: CHIP's Kconfig implies newlib-nano, whose default heap
# setup dies pre-main on nRF52840 (bisected 2026-08-03); the Zephyr default
# libc works.
CONFIG_PICOLIBC=y

# Test vendor/product identity (Matter test VID space)
CONFIG_CHIP_DEVICE_PRODUCT_ID=32768

# Keep the prototype lean
CONFIG_CHIP_OTA_REQUESTOR=n
CONFIG_CHIP_LIB_SHELL=n

# Open the commissioning window automatically on boot
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# Thread
CONFIG_NET_L2_OPENTHREAD=y
# CHIP's UDP endpoints need IPv6 packet info (recvmsg ancillary data) to
# answer from the correct source address; without this option the
# IPV6_RECVPKTINFO setsockopt fails (errno 109) and PASE handshakes die
# silently — the commissioner sees "address unreachable".
CONFIG_NET_CONTEXT_RECV_PKTINFO=y
# SLAAC is off in vanilla Zephyr (NCS turns it on): without it the device
# never gets an address from the border router's OMR prefix, and the SRP
# server rejects the host registration ("internal server error") — the
# node is then invisible to Matter on-network discovery.
CONFIG_OPENTHREAD_SLAAC=y

# Crypto: mbedTLS 4 provides the PSA API (tf-psa-crypto core)
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
# Vanilla default is a 1 KB mbedTLS heap — the first real ECC operation
# (PSA persistent-key export for the SRP KEY record) dies with
# PSA_ERROR_INSUFFICIENT_MEMORY (-141) and the node never registers
# with the SRP server. Match the NCS reference sizing.
CONFIG_MBEDTLS_HEAP_SIZE=15360
# Optimized M-profile P-256 driver (tf-psa-crypto p256-m): the generic
# ECC path needs ~3.2 s per SPAKE2+ step on the plain M33, which loses
# the race against the commissioner's PASE retransmission budget.
# (Speeds up PSA-routed ECDSA; CHIP's SPAKE2+ bypasses PSA and runs on
# mbedTLS ECP directly, hence the ASM switch below matters most there.)
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=y
# Bignum inner-loop assembly — off by default in vanilla Zephyr; without
# it SPAKE2+ (Pake1->Pake2) takes ~3.1 s and the matter.js commissioner
# aborts at its fixed ~3.3 s PASE probe budget first.
CONFIG_MBEDTLS_HAVE_ASM=y
# PSA features CHIP needs are forced via `select` in this app's Kconfig
# (MCUHOME_PROTO_PSA_WANTS): with MBEDTLS_PROMPTLESS active the
# PSA_WANT_* symbols are promptless and prj.conf assignments are
# silently ignored. (PSA_CRYPTO_ENABLE_ALL is no alternative — it
# enables every ECC curve and clashes with the p256-m partial
# acceleration, and CHIP's Spake2p context buffer overflows.)

# Memory sizing — vanilla Zephyr defaults (1 KB main stack, 0 B heap) are
# far below what the Matter stack needs; vendor SDKs raise these silently.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2560
CONFIG_HEAP_MEM_POOL_SIZE=15360

# Project config: dynamic endpoint slots (see include/CHIPProjectConfig.h)
CONFIG_CHIP_PROJECT_CONFIG="include/CHIPProjectConfig.h"
