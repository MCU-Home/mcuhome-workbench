# ============================================================================
# BUILD THIS SAMPLE WITH:  -S matter -S debug-rtt
#
#   west build -p -b nrf7002dk/nrf5340/cpuapp -S matter -S debug-rtt \
#       mcuhome/samples/matter-node
#
# The snippets carry the numeric/choice values the Matter stack needs (heap
# and stack sizing, mbedTLS acceleration, libc choice) and the RTT log
# transport. Building WITHOUT them is refused at CMake configure time by
# components/matter/CMakeLists.txt (with BUILD_ASSERTs in
# components/matter/src/matter_init.cpp as the backstop) — without that
# guard the image compiles fine and dies at runtime, pre-main or during
# PASE, with no console to say why.
# ============================================================================

# MCUHome framework: components/matter/Kconfig owns the Matter wiring
# (PSA_WANT_* selects, NET_CONTEXT_RECV_PKTINFO, OPENTHREAD_SLAAC, the
# PICOLIBC dependency and the Thread role choice), so none of that is
# repeated here.
CONFIG_MCUHOME=y
CONFIG_MCUHOME_MATTER=y

# The health foundation (lib/health/: reboot on fatal error, hardware
# watchdog, image self-confirmation) is on by default and stays on here —
# ADR 0015's health amendment makes the first two mandatory for every
# application image. The watchdog needs the watchdog0 alias, which the
# board overlay next to this file adds.
#
# Matter OTA is deliberately NOT enabled. This sample is built as a single
# image without MCUboot, so it has no partition table and no staging slot
# to download into; enabling CONFIG_MCUHOME_MATTER_OTA here would fail the
# build on a missing slot1_partition, correctly. Over-the-air update is a
# property of the board's update scheme in mcuhome/registry.py and appears
# in applications the builder generates (ADR 0015 decision 5), which are
# sysbuild builds with a bootloader.

# Channel layer: the generic sensor adapter that feeds both endpoints.
# The chip driver itself is not enabled here — CONFIG_BMP180 defaults to y
# from the devicetree node in the board overlay, which is the rule the
# builder will follow too (hardware in DTS, never in Kconfig).
CONFIG_SENSOR=y
CONFIG_MCUHOME_SENSOR=y

CONFIG_CHIP=y
CONFIG_STD_CPP17=y

# Test vendor/product identity (Matter test VID space)
CONFIG_CHIP_DEVICE_PRODUCT_ID=32768

# Open the commissioning window automatically on boot
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# Thread
CONFIG_NET_L2_OPENTHREAD=y

# Crypto: mbedTLS 4 provides the PSA API (tf-psa-crypto core)
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y

# Project config: dynamic endpoint slots (see include/CHIPProjectConfig.h)
CONFIG_CHIP_PROJECT_CONFIG="include/CHIPProjectConfig.h"
