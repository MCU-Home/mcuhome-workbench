# ============================================================================
# BUILD THIS SAMPLE WITH:  -S matter -S debug-rtt
#
#   west build -p -b nrf7002dk/nrf5340/cpuapp -S matter -S debug-rtt \
#       mcuhome/samples/matter-node
#
# The snippets carry the numeric/choice values the Matter stack needs (heap
# and stack sizing, mbedTLS acceleration, libc choice) and the RTT log
# transport. Building WITHOUT them still compiles — and then dies at
# runtime, pre-main or during PASE, with no console to say why. A
# build-time guard for this lands with the framework C code in Block A4.
# ============================================================================

# MCUHome framework: components/matter/Kconfig owns the Matter wiring
# (PSA_WANT_* selects, NET_CONTEXT_RECV_PKTINFO, OPENTHREAD_SLAAC, the
# PICOLIBC dependency and the Thread role choice), so none of that is
# repeated here.
CONFIG_MCUHOME=y
CONFIG_MCUHOME_MATTER=y

CONFIG_CHIP=y
CONFIG_STD_CPP17=y

# Test vendor/product identity (Matter test VID space)
CONFIG_CHIP_DEVICE_PRODUCT_ID=32768

# Open the commissioning window automatically on boot
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# Thread
CONFIG_NET_L2_OPENTHREAD=y

# Crypto: mbedTLS 4 provides the PSA API (tf-psa-crypto core)
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y

# Project config: dynamic endpoint slots (see include/CHIPProjectConfig.h)
CONFIG_CHIP_PROJECT_CONFIG="include/CHIPProjectConfig.h"
