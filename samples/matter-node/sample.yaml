sample:
  name: MCUHome Matter node sample
  description: >
    Minimal Matter node on vanilla Zephyr with one dynamically registered
    temperature endpoint, evaluating the dynamic-endpoint path of the
    MCUHome builder pipeline against upstream CHIP.
common:
  tags:
    - matter
    - mcuhome
tests:
  sample.mcuhome.matter_node:
    build_only: true
    platform_allow:
      - nrf7002dk/nrf5340/cpuapp
      - nrf52840dongle/nrf52840
