sample:
  name: MCUHome Matter node sample
  description: >
    Matter node on vanilla Zephyr with two runtime-registered endpoints
    (temperature EP1, pressure EP2, fed by a BMP180), exercising the
    MCUHome generated-tables contract against upstream CHIP.
common:
  tags:
    - matter
    - mcuhome
tests:
  sample.mcuhome.matter_node:
    build_only: true
    # The Matter runtime values (heap/stack sizing, mbedTLS acceleration,
    # picolibc) and the RTT log transport come from the framework snippets,
    # not from prj.conf — twister must apply them like a manual build does.
    extra_args:
      - SNIPPET="matter;debug-rtt"
    platform_allow:
      - nrf7002dk/nrf5340/cpuapp
      - nrf52840dongle/nrf52840
