common:
  tags:
    - mcuhome
    - matter
    - ota
tests:
  mcuhome.matter.ota_image_header:
    # Host-run: the parser is CHIP-free and Zephyr-free by construction,
    # so this is the only suite that exercises it without a full west
    # workspace / Zephyr SDK target build. Plain native_sim needs a
    # 32-bit host glibc that not every dev machine has; native/64 is the
    # 64-bit variant (same pattern as tests/matter_tables).
    platform_allow:
      - native_sim/native/64
    integration_platforms:
      - native_sim/native/64
