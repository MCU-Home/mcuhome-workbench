common:
  tags:
    - mcuhome
    - matter
tests:
  mcuhome.matter.tables_validate:
    # Host-run: table_validate.c is CHIP-free by construction (ADR 0014),
    # so this is the only suite that exercises it without a full west
    # workspace / Zephyr SDK target build. Plain native_sim needs a
    # 32-bit host glibc that not every dev machine has; native/64 is the
    # 64-bit variant (same pattern as upstream Zephyr's own host-run
    # suites, e.g. tests/lib/ringbuffer).
    platform_allow:
      - native_sim/native/64
    integration_platforms:
      - native_sim/native/64
