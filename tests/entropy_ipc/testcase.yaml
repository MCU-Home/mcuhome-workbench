common:
  tags:
    - mcuhome
    - entropy
tests:
  mcuhome.entropy_ipc.core:
    # Host-run for the same reason as the other suites here: the unit
    # under test is free of both CHIP and any transport by construction.
    # Plain native_sim needs a 32-bit host glibc that not every dev
    # machine has; native/64 is the 64-bit variant.
    platform_allow:
      - native_sim/native/64
    integration_platforms:
      - native_sim/native/64
