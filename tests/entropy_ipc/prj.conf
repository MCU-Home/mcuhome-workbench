CONFIG_ZTEST=y

# The unit under test is a CTR-DRBG wrapper, so Mbed TLS has to be real
# here. PSA_WANT_KEY_TYPE_AES is what makes MBEDTLS_AES_C appear, which
# is what makes ctr_drbg.c use the low-level AES module instead of
# routing through the PSA API — and that derivation only happens inside a
# PSA build, hence MBEDTLS_PSA_CRYPTO_C. Same requirement the driver's
# Kconfig states as dependencies, reproduced here because this build
# deliberately bypasses that Kconfig (CONFIG_MCUHOME_ENTROPY_IPC needs
# IPC_SERVICE, which native_sim has no backend for).
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_MBEDTLS_CTR_DRBG_C=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Several cases deliberately wait out a seed timeout, which costs real
# wall-clock seconds on native_sim.
CONFIG_ZTEST_SHUFFLE=n
