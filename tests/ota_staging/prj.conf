#
# The swap-using-offset scenario: what every MCUHome board class A runs
# (mcuhome/registry.py). The companion swap-move.conf is the same suite
# in a mode WITHOUT an offset, which is what proves the writer follows
# the bootloader mode instead of hard-coding a number.

CONFIG_ZTEST=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_SIMULATOR=y

CONFIG_STREAM_FLASH=y
CONFIG_STREAM_FLASH_ERASE=y

# flash_img lives here, and so does the offset rule the writer delegates
# to. MCUBOOT_IMG_MANAGER is the choice default under IMG_MANAGER.
CONFIG_IMG_MANAGER=y
CONFIG_IMG_BLOCK_BUF_SIZE=512

# The application-side statement of how the bootloader was built. The
# whole MCUBOOT_BOOTLOADER_MODE choice hangs off BOOTLOADER_MCUBOOT, and
# it is that choice — not this repository — that decides whether
# flash_img offsets the write.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_BOOTLOADER_MODE_SWAP_USING_OFFSET=y
