common:
  tags:
    - mcuhome
    - matter
    - ota
  # Host-run on native_sim's simulated flash, which brings a
  # slot1_partition with 4 KiB sectors — everything this needs. Plain
  # native_sim wants a 32-bit host glibc that not every dev machine has;
  # native/64 is the 64-bit variant (same pattern as tests/channel).
  platform_allow:
    - native_sim/native/64
  integration_platforms:
    - native_sim/native/64
tests:
  # The mode every MCUHome board class A runs, and the one that broke.
  mcuhome.matter.ota_staging.swap_using_offset: {}
  # A mode without an offset, so that "always add a sector" fails too.
  mcuhome.matter.ota_staging.swap_using_move:
    extra_args:
      - EXTRA_CONF_FILE=swap-move.conf
