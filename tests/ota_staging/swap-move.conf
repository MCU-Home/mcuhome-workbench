#
# The contrast case. Same suite, a bootloader mode that expects the
# update at the start of the secondary slot — so the expected offset is
# 0 and the tests say so. Without this scenario a writer that simply
# always added one sector would pass just as well as a correct one.

CONFIG_MCUBOOT_BOOTLOADER_MODE_SWAP_USING_OFFSET=n
CONFIG_MCUBOOT_BOOTLOADER_MODE_SWAP_USING_MOVE=y
