# SPDX-FileCopyrightText: 2026 The MCUHome Contributors
# SPDX-License-Identifier: Apache-2.0
#
# `mcuhome-workbench` — driving a build, at the
# repository root since the repository split: this repository is the
# workbench's home, the SDK (model, compiler, C runtime, west manifest)
# lives in github.com/mcu-home/mcuhome-sdk.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcuhome-workbench"
version = "0.1.0.dev0"
description = "MCUHome's build workbench: configuration pipeline, build context, the two build targets, signing."
readme = { text = """
Everything between a YAML device configuration and something a compiler
can be handed: parse, validate, resolve, create the build context, and
drive the build — locally, in a build container, or through a build
server — behind one interface. Plus client-side firmware signing.

`mcuhome.workbench.api` is the supported programmatic surface.

Part of the MCUHome firmware framework — https://github.com/mcu-home/mcuhome-workbench
""", content-type = "text/markdown" }
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "The MCUHome Contributors" }]
keywords = ["zephyr", "matter", "thread", "home-assistant", "firmware"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]
# Cross-repository edges: unpinned while nothing is
# published (development runs on editable checkouts); from v1.0 every
# edge becomes `~=X.Y.0` — same major.minor family, newest patch wins.
dependencies = [
  "mcuhome-model",
  # The package registry's own reference verifier, used as a library.
  # Signature thresholds, key rotation, document freshness and the
  # meta-entry hash have exactly one implementation in MCUHome, and it is
  # the one the registry runs over its own tree before it publishes — a
  # second copy of those rules here would drift from it silently.
  #
  # That repository publishes no distribution, so the edge is pinned the
  # way the SDK's image build pins the same library: by the commit its CI
  # checks out (`.github/workflows/ci-test.yml`, the mcuhome-packagetool
  # checkout `ref:`). Bumping it is deliberate — read that repository's
  # commits, then put the new SHA in that one place.
  "mcuhome-packagetool",
  # ruamel.yaml keeps line/column information on the parsed tree; every
  # validation error in this package points at a line.
  "ruamel.yaml>=0.18",
  # PEP 440 constraint resolution for the SDK and container pins.
  "packaging>=23",
  # The project file is TOML: tomllib reads it (standard library since
  # 3.11), and this writes it. A tested writer over one of our own,
  # because the file it produces is the project's identity — a bug in a
  # hand-rolled serializer would break projects, not just a build.
  "tomli-w>=1.0",
  # MCUboot's own signing tool. The workbench performs the one host-side
  # signing step, so the tool is a declared
  # dependency rather than an environment accident (PO 2026-08-15).
  # Pinned to the release line of the MCUboot revision the SDK's west
  # manifest resolves to — bump the two as a pair, like CHIP and Zephyr.
  "imgtool~=2.4",
  # The SDK package is a .tar.zst and the workbench unpacks it for
  # every build that resolves one, in either mode, so the codec is core
  # rather than an extra.
  "zstandard>=0.22",
]

[project.optional-dependencies]
# The `remote` build target and nothing else: the
# session client needs an async HTTP stack. The zstd codec it also needs
# is a core dependency now — SDK packages are unpacked on every path.
# Bound matches the build server's for the same library.
remote = ["aiohttp>=3.10,<4"]
# `generate_tree` and nothing else: writing a device's Zephyr application
# on this machine, for the caller who wants the tree for its own sake
# (`mcuhome device build --generate-only`). No build needs it — a
# build environment generates from the model its context carries — so it
# is an optional edge resolved at call time, and an
# install that never generates locally carries no part of stage 4.
generate = ["mcuhome-compiler"]

[project.urls]
Homepage = "https://github.com/mcu-home/mcuhome-workbench"
Issues = "https://github.com/mcu-home/mcuhome-workbench/issues"

# PEP 735 dependency group, not a [project.optional-dependencies] extra:
# these tools are for working on this repository, never a runtime
# dependency of it, so they must install standalone without pulling in
# mcuhome-model and its unpublished siblings. Pinned to the versions CI
# installs; bump here, CI follows.
[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff==0.16.1",
  "codespell==2.4.3",
  "reuse==5.0.2",
  "pre-commit-hooks==5.0.0",
]

[tool.setuptools]
# Enumerated, not discovered: `mcuhome` is a PEP 420 namespace shared
# with the SDK's distributions, and find_packages() there would claim
# directories this distribution does not own. Every subpackage added
# under mcuhome/workbench/ has to be listed here —
# tests/python/test_packaging_workbench.py fails when one is missing, which
# is cheaper than a wheel that installs without it.
packages = ["mcuhome.workbench", "mcuhome.workbench.migrations"]

# The trust anchors shipped with the workbench. They are data, not code:
# one JSON file per package-registry base domain, written into a project's
# `secrets/trust-anchor/` when the project is created and never after —
# a build that finds one missing refuses rather than installing a trust
# root of its own. An anchor that failed to make it into the wheel would
# leave every new project unable to verify what it downloads, so it is
# declared rather than assumed.
[tool.setuptools.package-data]
"mcuhome.workbench" = ["trust-anchor/*.json"]

[tool.ruff]
line-length = 100
target-version = "py313"
# ADRs are prose; ruff format would rewrite fenced code blocks.
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

# The ignored words are deliberate spellings, not slips: Requestor and PASE
# are the Matter specification's own, OT is OpenThread, rsource is
# Kconfig's. Only .git is skipped: this repository holds no vendored or
# generated formats whose wording is not ours to correct. Moved here from
# the CI command line so scripts/lint.d/codespell can run the plain tool.
[tool.codespell]
ignore-words-list = "requestor,pase,ot,rsource,re-declared,re-declare,re-used,unparseable,pre-empt"
skip = "./.git"
