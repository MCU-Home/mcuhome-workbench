# SPDX-FileCopyrightText: 2026 The MCUHome Contributors
# SPDX-License-Identifier: Apache-2.0
#
# `mcuhome-workbench` — driving a build (ADR 0020 decision 1), at the
# repository root since the ADR 0024 split: this repository is the
# workbench's home, the SDK (model, compiler, C runtime, west manifest)
# lives in github.com/mcu-home/mcuhome-sdk.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcuhome-workbench"
version = "0.1.0.dev0"
description = "MCUHome's build workbench: configuration pipeline, build context, the three build methods, signing."
readme = { text = """
Everything between a YAML device configuration and something a compiler
can be handed: parse, validate, resolve, create the build context, and
drive the build — locally, in a build container, or through a build
server — behind one interface. Plus client-side firmware signing.

`mcuhome.workbench.api` is the supported programmatic surface.

Part of the MCUHome firmware framework — https://github.com/mcu-home/mcuhome-workbench
""", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "The MCUHome Contributors" }]
keywords = ["zephyr", "matter", "thread", "home-assistant", "firmware"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]
# Cross-repository edges since ADR 0024: unpinned while nothing is
# published (development runs on editable checkouts); from v1.0 every
# edge becomes `~=X.Y.0` — same major.minor family, newest patch wins.
dependencies = [
  "mcuhome-model",
  # ruamel.yaml keeps line/column information on the parsed tree; every
  # validation error in this package points at a line.
  "ruamel.yaml>=0.18",
  # PEP 440 constraint resolution for the SDK and container pins (E52).
  "packaging>=23",
  # The project file is TOML: tomllib reads it (standard library since
  # 3.11), and this writes it. A tested writer over one of our own,
  # because the file it produces is the project's identity — a bug in a
  # hand-rolled serializer would break projects, not just a build.
  "tomli-w>=1.0",
  # MCUboot's own signing tool. The workbench performs the one host-side
  # signing step (ADR 0015 decision 8), so the tool is a declared
  # dependency rather than an environment accident (PO 2026-08-15).
  # Pinned to the release line of the MCUboot revision the SDK's west
  # manifest resolves to — bump the two as a pair, like CHIP and Zephyr.
  "imgtool~=2.4",
  # The SDK package is a .tar.zst and the orchestrator unpacks it for
  # every container build, so the codec is core rather than an extra.
  # It was in `remote` alone while the orchestrator lived elsewhere.
  "zstandard>=0.22",
]

[project.optional-dependencies]
# The `remote` build method and nothing else (E18, ADR 0019): the
# session client needs an async HTTP stack. The zstd codec it also needs
# is a core dependency now — the orchestrator unpacks SDK packages with
# it on every path. Bound matches the build server's for the same library.
remote = ["aiohttp>=3.10,<4"]
# `generate_tree` and nothing else: writing a device's Zephyr application
# on this machine, for the caller who wants the tree for its own sake
# (`mcuhome device build --generate-only`). No build method needs it — a
# build environment generates from the model its context carries — so it
# is an optional edge resolved at call time (ADR 0020 decision 3), and an
# install that never generates locally carries no part of stage 4.
generate = ["mcuhome-compiler"]

[project.urls]
Homepage = "https://github.com/mcu-home/mcuhome-workbench"
Issues = "https://github.com/mcu-home/mcuhome-workbench/issues"

[tool.setuptools]
# Enumerated, not discovered: `mcuhome` is a PEP 420 namespace shared
# with the SDK's distributions, and find_packages() there would claim
# directories this distribution does not own. Every subpackage added
# under mcuhome/workbench/ has to be listed here —
# tests_py/test_packaging_workbench.py fails when one is missing, which
# is cheaper than a wheel that installs without it.
packages = ["mcuhome.workbench", "mcuhome.workbench.migrations"]

[tool.ruff]
line-length = 100
target-version = "py311"
# ADRs are prose; ruff format would rewrite fenced code blocks.
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests_py"]

[tool.codespell]
ignore-words-list = "requestor,pase,ot,rsource"
