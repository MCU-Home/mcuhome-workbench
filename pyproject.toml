[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcuhome"
version = "0.1.0.dev0"
description = "MCUHome firmware builder: compiles MCUHome YAML device configurations into Zephyr firmware images."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "The MCUHome Contributors" }]
keywords = [
  "zephyr",
  "matter",
  "thread",
  "coap",
  "home-assistant",
  "firmware",
  "esphome-alternative",
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]
# One runtime dependency, on purpose: ruamel.yaml is the only YAML parser
# that keeps line/column information on the parsed tree, and every
# validation error in this builder points at a line. Everything else
# (CLI, validation) is the standard library plus hand-written checks —
# error messages are user interface here, and a schema library's generic
# wording does not meet that bar.
dependencies = ["ruamel.yaml>=0.18"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/mcu-home/mcuhome"
Issues = "https://github.com/mcu-home/mcuhome/issues"
Changelog = "https://github.com/mcu-home/mcuhome/blob/main/CHANGELOG.md"

[project.scripts]
mcuhome = "mcuhome.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["mcuhome"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Design documents are prose; the Python sketches inside them illustrate
# an idea and are not source. `ruff format` reformats fenced code blocks
# in Markdown, which would silently rewrite approved design records.
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Python tests live in tests_py/, not in tests/: tests/ holds Zephyr
# twister suites (testcase.yaml per directory) and twister recurses into
# whatever it is pointed at. Two runners, two roots, no overlap — see
# tests_py/README.md.
[tool.pytest.ini_options]
testpaths = ["tests_py"]

# Domain vocabulary codespell would "correct" into errors: OTA Requestor
# is the Matter specification's own cluster name, PASE/OT are protocol
# names, rsource is Kconfig syntax.
#
# The generated .matter IDL is skipped: ZAP writes it from CHIP's own
# cluster XML, spelling mistakes included, and it is regenerated per
# release — so a fix here would be undone by the next regeneration and
# belongs upstream instead.
[tool.codespell]
ignore-words-list = "requestor,pase,ot,rsource"
skip = "./components/matter/zap/*.matter"

