name: Bug report
description: Report a defect in the MCUHome firmware framework or builder
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! MCUHome is pre-alpha —
        please check [existing issues](https://github.com/mcu-home/mcuhome-workbench/issues)
        first. Questions belong in
        [Discussions](https://github.com/mcu-home/mcuhome-workbench/discussions).
  - type: input
    id: version
    attributes:
      label: MCUHome version
      placeholder: e.g. 0.1.0.dev0 / git commit hash
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Board / SoC
      placeholder: e.g. nrf52840dk/nrf52840, esp32s3_devkitm/esp32s3/procpu, native_sim
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Network transport
      options:
        - WiFi
        - Thread (router-eligible / FTD)
        - Thread (minimal / MTD)
        - Thread (Sleepy End Device)
        - Not network-related
        - Other
    validations:
      required: true
  - type: input
    id: zephyr
    attributes:
      label: Zephyr version
      placeholder: e.g. v4.4.0 (from west.yml pin)
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: YAML device configuration
      description: The minimal configuration that reproduces the problem. Remove secrets!
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Build output or device logs.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed all secrets (WiFi credentials, Thread network keys, Matter codes) from config and logs.
          required: true
