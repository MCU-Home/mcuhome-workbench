#
# CI for the MCUHome workbench (the flagship/tools repository, ADR
# 0024). Two gates:
#
#   lint   — the same ruff/REUSE checks .pre-commit-config.yaml runs
#            locally. Needs nothing but Python.
#   pytest — the Python suite in tests_py/, testing mcuhome.workbench.
#            Needs mcuhome-model and mcuhome-compiler, which this repo
#            does not publish any more (ADR 0024) — they come from a
#            plain public checkout of the sibling mcu-home/mcuhome-sdk
#            repository. The `remote` build method's own suite
#            (test_sessionclient.py) additionally needs a live
#            mcuhome-build-server peer, so mcu-home/build-server is
#            checked out the same way. Both repositories are public, so
#            no deploy key is needed for either checkout — ADR 0024 §3
#            retired those together with repository privacy.
#
# All actions are pinned to commit SHAs, not tags (see dependabot.yml,
# which keeps the pins current via its github-actions ecosystem entry).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + REUSE)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Pinned to the same versions as .pre-commit-config.yaml so local
      # and CI runs agree; bump both together.
      - name: Install lint tools
        run: python -m pip install --disable-pip-version-check ruff==0.16.1 reuse==5.0.2

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: REUSE lint
        run: reuse lint

  pytest:
    name: pytest (tests_py)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Plain public checkouts — both repositories are public (ADR 0024
      # §3), so no token or deploy key is needed for either.
      - name: Checkout mcu-home/mcuhome-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/mcuhome-sdk
          path: .deps/mcuhome-sdk

      - name: Checkout mcu-home/build-server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcu-home/build-server
          path: .deps/build-server

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The workbench itself supports >=3.11; 3.13 is the floor of
          # mcuhome-build-server, installed below as the live peer
          # test_sessionclient.py drives its client against.
          python-version: "3.13"

      # mcuhome-model and mcuhome-compiler from the SDK checkout,
      # mcuhome-workbench (this repo, with the `remote` extra for
      # test_sessionclient.py's aiohttp/zstandard dependency) and
      # mcuhome-build-server as the real peer that same file drives its
      # session-protocol client against.
      - name: Install the distributions
        run: |
          python -m pip install --disable-pip-version-check \
            -e ./.deps/mcuhome-sdk/packaging/model \
            -e ./.deps/mcuhome-sdk/packaging/compiler \
            -e '.[remote]' \
            -e ./.deps/build-server \
            'pytest>=8.0'

      - name: pytest
        run: pytest -q -rs
