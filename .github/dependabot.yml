version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]

  # Added together with the first CI workflow (.github/workflows/ci.yml).
  # All actions there are pinned to commit SHAs, not tags, so dependabot
  # can bump them with a reviewable diff.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
