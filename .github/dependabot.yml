#
# The github-actions ecosystem entry is added together with the first CI
# workflow — dependabot errors on repos without workflow files. Pin all
# actions to full commit SHAs when that happens.

version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
