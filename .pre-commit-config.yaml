#
# Install: pre-commit install --install-hooks
#          pre-commit install --hook-type commit-msg
# Update pins periodically with: pre-commit autoupdate

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # The builder's test fixtures are MCUHome device configurations
        # and use its own `!secret` tag, which this hook's safe loader
        # cannot construct. Excluded rather than run with --unsafe, which
        # would weaken the check for every other YAML in the repository.
        exclude: ^tests_py/data/
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell

  - repo: https://github.com/fsfe/reuse-tool
    rev: v5.0.2
    hooks:
      - id: reuse

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: clang-format
        name: clang-format (Zephyr style)
        language: system
        entry: clang-format -i
        # .cpp too: components/matter is C++ internally (CHIP is a C++ SDK)
        # while its public headers stay C-clean.
        files: \.(c|h|cpp)$

      - id: check-debug-output
        name: debug-output policy (AGENTS.md)
        # Debug output is load-bearing: no config fragment reduces
        # diagnostics without a recorded decision and its
        # `# debug-output: approved <reason>` marker.
        language: system
        entry: python3 scripts/check_debug_output.py
        pass_filenames: false
        always_run: true
