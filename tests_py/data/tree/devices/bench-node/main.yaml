# Test fixture: a device that leans on defaults.
#
# No endpoint id (numbered automatically), no sampling period, no report
# delta, no measurement range, no explicit Thread role, no I2C address —
# every one of those is resolved, and the resolved values are asserted.
# The friendly name comes from secrets.yaml so the fixture tree exercises
# !secret as well.

device:
  name: bench-node
  friendly_name: !secret device_label
  board: nrf7002dk/nrf5340/cpuapp
  power:
    source: battery

network:
  thread: {}
  matter:
    enabled: true

hardware:
  buses:
    i2c0:
      controller: arduino_i2c
  peripherals:
    baro:
      driver: bosch,bmp180
      bus: i2c0

node:
  endpoints:
    - device_type: temperature_sensor
      clusters:
        temperature_measurement:
          source: baro.temperature
