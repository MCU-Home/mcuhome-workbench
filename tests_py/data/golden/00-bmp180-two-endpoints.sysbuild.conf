# Generated by mcuhome from 00-bmp180-two-endpoints.yaml — do not edit.
#
# Sysbuild configuration for device "bmp180-node". Every MCUHome image boots through MCUboot (ADR
# 0015 decision 1), and vanilla Zephyr builds a bootloader only under sysbuild — which is why this
# file exists and why the application is built with --sysbuild.
#
# Board class A: the second copy of the image lives on the board's external flash part, so a failed
# update can be rolled back. The flash layout that follows from it is in
# boards/nrf7002dk_nrf5340_cpuapp.overlay and in sysbuild/mcuboot.overlay, and the bootloader's own
# settings are in sysbuild/mcuboot.conf.
#
# THE SIGNING KEY IS NOT IN THIS FILE, AND NOT IN THIS TREE. It is a per-user secret (ADR 0015
# decision 8), so mcuhome build passes it on the command line:
#   -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE="<path to your signing.key>"
# Building this tree by hand without that argument does not fail — it signs with MCUboot's demo key,
# whose private half is published in the MCUboot repository. An image signed with it is not signed;
# it only looks signed. Pass the key.

SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_OFFSET=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y

# One hex file with every image at its own offset. Off upstream,
# on here: bringing a board into the MCUHome standard state writes
# the bootloader and the application together (ADR 0016 decision 2),
# and on a development kit that is one debug-probe flash of one file.
SB_CONFIG_MERGED_HEX_FILES=y
