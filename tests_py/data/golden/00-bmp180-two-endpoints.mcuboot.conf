# Generated by mcuhome from 00-bmp180-two-endpoints.yaml — do not edit.
#
# Kconfig fragment for the MCUboot image. Sysbuild derives the swap mode and the signature type from
# sysbuild.conf next to this file; what is below is everything that does not follow from those two.
#
# Recovery: serial-recovery, boot-mode, button.

CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_LOG=y
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_OVERWRITE=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_BOOT_SERIAL_BOOT_MODE=y
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_MULTITHREADING=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=n

# LTO, this image only (measured -7.55 KiB). Strictly per-image:
# sysbuild gives every image its own Kconfig fragment, so the
# application build is untouched by design.
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_LTO=y
CONFIG_LTO_SINGLE_THREADED=y

# How many flash sectors MCUboot has to be able to track per slot.
# Not left to CONFIG_BOOT_MAX_IMG_SECTORS_AUTO: it reads the block size
# of slot0's flash node and applies it to slot1 as well, which is wrong
# the moment the two slots live on different parts — as they do here
# (ADR 0015 decision 3; upstream bug candidate). The number below is
# 912 KiB of slot divided by the 4096 B erase unit.
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=228
