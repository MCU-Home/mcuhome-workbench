#
# West manifest for the MCUHome firmware framework.
#
# This repository uses the west "T2" star topology: it is the manifest
# repository of the workspace. The workspace top directory must NOT be a
# git repository itself.
#
# Usage (inside an empty workspace directory):
#   west init -m https://github.com/mcu-home/mcuhome
#   west update
#
# Or with an existing clone (workspace-dir/mcuhome = this repo):
#   west init -l mcuhome
#   west update

manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: project-chip
      url-base: https://github.com/project-chip

  projects:
    # Zephyr is pinned to a release tag — never track main. Bump the pin
    # deliberately and update the matching Zephyr release/SDK references in
    # README.md and CONTRIBUTING.md at the same time. (v4.5 is expected
    # 2026-10, next LTS v4.6 ~2027-04.)
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.4.0
      import:
        # Keep the workspace small: only pull the modules we actually use.
        # Extend this list as board and feature support grows.
        name-allowlist:
          - cmsis_6        # ARM CMSIS headers (nRF and other ARM SoCs)
          - hal_nordic     # Nordic nRF52/53/54 HAL (primary Thread targets)
          - hal_espressif  # Espressif ESP32 HAL (WiFi targets; requires
                           # `west blobs fetch hal_espressif`)
          - mbedtls        # TLS/crypto (CoAP over DTLS, Matter)
          - tf-psa-crypto  # PSA crypto core, required companion of mbedtls
          - openthread     # Thread stack incl. MTD/SED device roles
          - segger         # RTT (debugger-channel logging), SystemView
          - open-amp       # RPMsg inter-core IPC (nRF53 app<->net core)
          - libmetal       # HW abstraction used by open-amp
          - mcuboot        # Secure bootloader; sysbuild builds it as the
                           # second image (MCUBOOT_MODE_*). Zephyr puts it
                           # in the `bootloader` group, which its own
                           # group-filter leaves enabled, so no group-filter
                           # change is needed on our side.
          - zcbor          # CBOR codec. Not optional next to mcuboot:
                           # MCUboot's serial recovery (MCUBOOT_SERIAL) and
                           # every mcumgr/SMP transport select it, and a
                           # `select` on a module that the manifest did not
                           # pull fails the build at Kconfig time.

    # Matter SDK (upstream CHIP, prototype pin — ADR 0006 evaluation).
    # CHIP vendors its dependencies as git submodules, hence the explicit
    # `submodules:` list. In the optional "matter" west group so it can
    # be skipped via group-filter.
    - name: connectedhomeip
      remote: project-chip
      revision: v1.5.1.0
      path: modules/lib/connectedhomeip
      groups:
        - matter
      submodules:
        - path: third_party/nlio/repo
        - path: third_party/nlassert/repo
        - path: third_party/pigweed/repo
        - path: third_party/jsoncpp/repo

  self:
    path: mcuhome
