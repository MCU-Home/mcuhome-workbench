#
# `mcuhome-compiler` — performing a build (ADR 0020 decision 1).
#
# See `packaging/model/pyproject.toml` for why the project directory and
# the code it ships are in different places.
#
# The dependency on `mcuhome-workbench` is a base dependency and not an
# extra. ADR 0020 decision 3's optionality runs the OTHER way — workbench
# may pull the compiler in for the `local-dev` build method — and it stays
# an extra there because no static import expresses it. This direction is
# a static import and cannot be optional: `mcuhome.compiler.abi` imports
# `mcuhome.workbench.contextdir` and `mcuhome.workbench.api` at module
# level, because the invocation-ABI adapter verifies a context and reads a
# device model before it compiles anything.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcuhome-compiler"
# Dynamic for the same reason as in `packaging/workbench/`: the pin on
# the sibling distribution is exact and must not be a second copy of the
# release version. See the `setup.py` next to this file.
dynamic = ["version", "dependencies"]
description = "MCUHome's compiler: code generation, west orchestration, build report, invocation-ABI adapter."
readme = { text = """
Stages 4 and 5 of the MCUHome build: the per-device Zephyr application,
the west invocation that compiles it, the artifact set and the build
report — plus the adapter that turns a build container's invocation into
exactly that build.

This is what ships inside the MCUHome SDK package and runs in the build
container. An installation that only ever drives builds through a
container never installs it.

Part of the MCUHome firmware framework — https://github.com/mcu-home/mcuhome
""", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "The MCUHome Contributors" }]
keywords = ["zephyr", "matter", "thread", "home-assistant", "firmware"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/mcu-home/mcuhome"
Issues = "https://github.com/mcu-home/mcuhome/issues"
Changelog = "https://github.com/mcu-home/mcuhome/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["mcuhome.compiler"]

[tool.setuptools.package-dir]
"" = "../.."

[tool.setuptools.dynamic]
version = { attr = "mcuhome.model.__version__" }
