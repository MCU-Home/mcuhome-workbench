#
# `mcuhome-model` — the shared vocabulary (ADR 0020 decision 1).
#
# The three distributions of this repository are built from ONE source
# tree, `mcuhome/` at the repository root, because that tree is also the
# SDK package: a build container puts the SDK root on PYTHONPATH and
# `bin/generate` inserts it into sys.path, so the import package has to
# sit there and nowhere else. What differs per distribution is which
# subpackage it ships, which is why the project directories are here and
# the code is not — `package-dir` maps the empty prefix two levels up and
# `packages` names the one subpackage this distribution owns. Nothing
# else of the tree ends up in the wheel; `tests_py/test_packaging.py`
# checks that against the built artifacts rather than trusting it.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcuhome-model"
dynamic = ["version"]
description = "MCUHome's shared vocabulary: device model, registry, context and manifest formats, error types."
readme = { text = """
The part of MCUHome that every execution site needs and none of them may
re-derive: the device model, the registry, the build-context and
build-manifest formats including the frozen context-ID rule, the error
types. No build machinery and no I/O beyond reading a file to hash it.

Part of the MCUHome firmware framework — https://github.com/mcu-home/mcuhome
""", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "The MCUHome Contributors" }]
keywords = ["zephyr", "matter", "thread", "home-assistant", "firmware"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]
# None, and that is the property rather than an accident: this is the
# package a build server consumes and nothing else (ADR 0020 decision 4),
# so it carries no parser, no toolchain and no transitive surface at all.
dependencies = []

[project.urls]
Homepage = "https://github.com/mcu-home/mcuhome"
Issues = "https://github.com/mcu-home/mcuhome/issues"
Changelog = "https://github.com/mcu-home/mcuhome/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["mcuhome.model"]

[tool.setuptools.package-dir]
"" = "../.."

# The one version of the release (ADR 0017 §3, ADR 0020 decision 8),
# read from the module that holds it. All three `pyproject.toml` files
# here name this same attribute, so there is no second copy to bump.
[tool.setuptools.dynamic]
version = { attr = "mcuhome.model.__version__" }
