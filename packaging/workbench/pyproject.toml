#
# `mcuhome-workbench` — driving a build (ADR 0020 decision 1).
#
# See `packaging/model/pyproject.toml` for why the project directory and
# the code it ships are in different places.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcuhome-workbench"
# `dependencies` is dynamic because the pin on `mcuhome-model` is an
# exact one and must not be a second place the version is written down —
# `setup.py` next to this file derives it from the same attribute the
# version comes from. ADR 0020 decision 8: one version, one tag, one
# release, and therefore no compatibility matrix to consult.
#
# `optional-dependencies` joins it because `dynamic` is per field and not
# per entry: the `remote` extra is declared in the same `setup.py` call,
# and setuptools silently *discards* an `extras_require` whose field is
# not listed here — measured, not assumed. A dropped extra would make
# `pip install 'mcuhome-workbench[remote]'` succeed and install nothing,
# which is the one failure shape worse than a refusal.
dynamic = ["version", "dependencies", "optional-dependencies"]
description = "MCUHome's build workbench: configuration pipeline, build context, the three build methods, signing."
readme = { text = """
Everything between a YAML device configuration and something a compiler
can be handed: parse, validate, resolve, create the build context, and
drive the build — locally, in a build container, or through a build
server — behind one interface. Plus client-side firmware signing.

`mcuhome.workbench.api` is the supported programmatic surface.

Part of the MCUHome firmware framework — https://github.com/mcu-home/mcuhome
""", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "The MCUHome Contributors" }]
keywords = ["zephyr", "matter", "thread", "home-assistant", "firmware"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/mcu-home/mcuhome"
Issues = "https://github.com/mcu-home/mcuhome/issues"
Changelog = "https://github.com/mcu-home/mcuhome/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["mcuhome.workbench"]

[tool.setuptools.package-dir]
"" = "../.."

[tool.setuptools.dynamic]
version = { attr = "mcuhome.model.__version__" }
