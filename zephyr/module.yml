#
# Zephyr module definition. This gives the repository its second role:
# besides being the west manifest repository of the MCUHome workspace, it
# can be consumed as a plain Zephyr module by any application that lists
# it in its own west manifest or in ZEPHYR_EXTRA_MODULES.
#
# The name is declared, not inferred. Without this key Zephyr falls back
# to the directory basename (zephyr/scripts/zephyr_module.py, meta name
# defaulting to module_path.name), and the basename is whatever the
# consumer happened to clone or unpack the SDK as. Generated CMakeLists
# reach back into this module as ${ZEPHYR_MCUHOME_MODULE_DIR}
# (mcuhome/compiler/generate.py), and an undefined CMake variable expands to the
# empty string rather than failing — so an inferred name turns a renamed
# directory into a file-not-found halfway through the configure step.
name: mcuhome

build:
  cmake: .
  kconfig: Kconfig
  settings:
    board_root: .
    dts_root: .
    snippet_root: .
