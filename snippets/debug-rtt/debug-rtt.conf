#
# RTT log transport: routes logging (Zephyr LOG, printk, OpenThread, CHIP)
# through SEGGER RTT instead of a UART console — useful whenever the UART
# is needed for something else, or there is no host UART at all (e.g. the
# nRF52840 dongle). Apply with `-S debug-rtt`. See
# docs/design/matter-zephyr-integration.md for the findings behind these
# settings.

CONFIG_USE_SEGGER_RTT=y
# debug-output: approved RTT replaces the UART console — this snippet IS the log transport
CONFIG_UART_CONSOLE=n
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y

# OVERWRITE, not DROP — and this is a safety setting, not a preference.
#
# All three RTT backend modes claim to handle a full up-buffer, and two of
# them stop doing so in panic mode. log_backend_rtt.c routes DROP-mode
# output through data_out_drop_mode(), which begins with
#
#     if (is_sync_mode()) { return data_out_block_mode(data, length, ctx); }
#
# and is_sync_mode() is true as soon as the backend's panic() ran. From
# there on_write() spins
#
#     while (SEGGER_RTT_HasDataUp(...) && host_present) on_failed_write(...);
#
# waiting for a host to drain the buffer — a k_busy_wait() on the fatal
# path. Two details turn that from slow into open-ended.
# data_out_block_mode() budgets a single retry when the mode is not
# BLOCK, and on_failed_write() spends it on one k_busy_wait() of
# LOG_BACKEND_RTT_RETRY_DELAY_MS — a symbol declared inside
# `if LOG_BACKEND_RTT_MODE_BLOCK` in Zephyr's Kconfig.rtt, so a DROP-mode
# build cannot set it at all and inherits the file's hardcoded 10 ms. And
# on_write() sets host_present back to true on every successful write, so
# the "the host went away" latch that is supposed to end this never
# holds. With the 1-byte log_output buffer DROP mode gets, that is ~10 ms
# per CHARACTER for as long as the up-buffer has room: tens of seconds of
# a fatal path that is supposed to take milliseconds, on the exact path
# ADR 0015's rollback story depends on. Upstream's own backend help text
# says it outright: "In panic mode backend always blocks and waits until
# there is space in up-buffer".
#
# OVERWRITE is the one mode that does not. data_out_overwrite_mode() has
# no retry loop, no host_present latch and no busy-wait in any mode; it
# calls SEGGER_RTT_WriteWithOverwriteNoLock() and returns. The cost is
# that a full buffer loses the OLDEST unread bytes instead of the newest,
# and that a host reading concurrently can see the read pointer move under
# it. Both are the right trade here: the bench failure this replaces was a
# 4 KiB buffer full of boot chatter that no reader had drained, so the
# fault dump — the only thing anyone wanted — was dropped in its entirety.
# Keeping the newest output is what a crash log is for.
#
# See also lib/health/health.c, which is bounded BECAUSE of this line.
CONFIG_LOG_BACKEND_RTT_MODE_OVERWRITE=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# The log thread formats every line, and with Matter and OpenThread
# logging on it formats long ones through cbprintf. Vanilla's 768 B is the
# minimum Zephyr can boot with, not a size anybody chose for this load —
# and with debug output load-bearing by directive (AGENTS.md) this thread
# is on the critical path, not a nice-to-have.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# OpenThread stack logging (SRP client / mesh forwarder visibility)
CONFIG_OPENTHREAD_DEBUG=y
CONFIG_OPENTHREAD_LOG_LEVEL_INFO=y

# CHIP at info: errors/progress without the per-report [DMG] debug flood
CONFIG_MATTER_LOG_LEVEL_INF=y

# Re-initialize the RTT control block at boot (lib/debug/Kconfig) — without
# it, a reset leaves stale read/write offsets from the previous session and
# the log backend's NoLock writes silently wedge (upstream candidate Z7).
CONFIG_MCUHOME_RTT_REINIT=y

# --- What a fault is allowed to leave unsaid ----------------------------
#
# The three settings below turn Zephyr's fault dump from "something went
# wrong" into an address and a thread name. They belong in this snippet
# rather than in an opt-in debug build because MCUHome ships debug output
# on (AGENTS.md, product-owner directive): the first fault on a device is
# the one worth understanding, and it is never the one somebody rebuilt
# for.
#
# A BusFault during an OTA download on 2026-08-08 produced a dump with
# none of this in it — no faulting thread, no PC, no BFAR — and the whole
# analysis afterwards had to be done from a memory dump and source
# reading.

# Callee-saved registers and the exception return address in the dump, so
# the report names PC, LR and BFAR instead of only a fault class — and, on
# Cortex-M, a call stack with them: this symbol is what makes
# ARCH_STACKWALK selectable, EXCEPTION_STACK_TRACE then defaults to y
# (subsys/debug/Kconfig), and Zephyr consequently compiles the WHOLE image
# with -funwind-tables (arch/arm/core/CMakeLists.txt).
#
# That last step is by far the most expensive line in this file and the
# number belongs next to it, not in a commit message. Measured on the
# reference device (nrf7002dk/nrf5340/cpuapp, 2026-08-08): .ARM.exidx and
# .ARM.extab together are 52.5 KiB, 91% of this snippet's whole +57.7 KiB
# flash cost, and they put the application at 80.6% of its 912 KiB slot.
# It fits with 176 KiB to spare, and a backtrace is exactly what the fault
# that motivated this snippet did not have.
#
# If that slot ever does get tight, CONFIG_EXCEPTION_STACK_TRACE=n is the
# first lever: it keeps the registers and the fault address, drops only
# the backtrace, and takes the tables with it. Per the debug-output
# directive (AGENTS.md) that is a decision to make with the product
# owner, not one to absorb quietly.
CONFIG_EXTRA_EXCEPTION_INFO=y

# Thread names in the dump ("Current thread: 0x... (CHIP)"). Without it
# every fault report says "unknown", which on a node with a dozen service
# threads throws away most of the information the dump had.
CONFIG_THREAD_NAME=y

# Fill every stack with 0xAA at creation so that unused depth is
# measurable afterwards (k_thread_stack_space_get, or a debugger looking
# for the last 0xAA). Boot-time cost only. This is what turns the stack
# sizes in snippets/matter into measured numbers instead of guesses — see
# the note at the top of that file.
CONFIG_INIT_STACKS=y
