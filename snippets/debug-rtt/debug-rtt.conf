# RTT log transport: routes logging (Zephyr LOG, printk, OpenThread, CHIP)
# through SEGGER RTT instead of a UART console — useful whenever the UART
# is needed for something else, or there is no host UART at all (e.g. the
# nRF52840 dongle). Apply with `-S debug-rtt`. See
# docs/design/matter-zephyr-integration.md for the findings behind these
# settings.

CONFIG_USE_SEGGER_RTT=y
# debug-output: approved RTT replaces the UART console — this snippet IS the log transport
CONFIG_UART_CONSOLE=n
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
# Never block logging on a full RTT buffer (a wedged/absent host reader
# must not stall the device)
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# OpenThread stack logging (SRP client / mesh forwarder visibility)
CONFIG_OPENTHREAD_DEBUG=y
CONFIG_OPENTHREAD_LOG_LEVEL_INFO=y

# CHIP at info: errors/progress without the per-report [DMG] debug flood
CONFIG_MATTER_LOG_LEVEL_INF=y

# Re-initialize the RTT control block at boot (lib/debug/Kconfig) — without
# it, a reset leaves stale read/write offsets from the previous session and
# the log backend's NoLock writes silently wedge (upstream candidate Z7).
CONFIG_MCUHOME_RTT_REINIT=y
