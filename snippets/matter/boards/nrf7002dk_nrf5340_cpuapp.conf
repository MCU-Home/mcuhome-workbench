# nRF5340: 802.15.4 sizing fix for this SoC's spinel-serialized radio path
# (net core runs 802154_rpmsg). RTT/log settings live in the debug-rtt
# snippet, not here.

# The OT radio workqueue calls into the 802.15.4 spinel serialization on
# nRF53 (netcore radio) — the 512 B default overflows (verified via
# fatal-error breakpoint). Size for the serialized path.
CONFIG_OPENTHREAD_RADIO_WORKQUEUE_STACK_SIZE=4096
