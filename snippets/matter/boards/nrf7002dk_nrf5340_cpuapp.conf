#
# nRF5340: 802.15.4 sizing fix for this SoC's spinel-serialized radio path
# (net core runs 802154_rpmsg). RTT/log settings live in the debug-rtt
# snippet, not here.

# The OT radio workqueue calls into the 802.15.4 spinel serialization on
# nRF53 (netcore radio) — the 512 B default overflows (verified via
# fatal-error breakpoint). Size for the serialized path.
CONFIG_OPENTHREAD_RADIO_WORKQUEUE_STACK_SIZE=4096

# The other two threads on that serialized path, both still at their
# vanilla defaults and both sized for a driver that talks to a radio on
# the same die. On this SoC they talk to the network core instead, so
# every frame carries the spinel encode/decode and the RPMSG/IPC layer on
# top of what the numbers were chosen for. Same reasoning and the same
# provisional status as the stacks in ../matter.conf: headroom now,
# measurements once CONFIG_INIT_STACKS has produced high-water figures
# from a full download.

# 800 B vanilla, for the thread that hands received frames to the net
# stack after the serialization layer has rebuilt them.
CONFIG_IEEE802154_NRF5_RX_STACK_SIZE=1024

# 1024 B vanilla for the RPMSG backend workqueue, which on an MCUHome
# nRF5340 build carries two endpoints on ipc0: the 802.15.4 spinel channel
# (every radio frame, in both directions) and the entropy service in
# drivers/entropy — so a CSPRNG request can land on it in the middle of a
# frame burst.
CONFIG_IPC_SERVICE_BACKEND_RPMSG_WQ_STACK_SIZE=2048
