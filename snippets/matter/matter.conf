# Matter (CHIP) runtime defaults: numeric/choice Kconfig values vanilla
# Zephyr ships too small (or off) for CHIP to run reliably. Apply with
# `-S matter`. Root causes: docs/design/matter-zephyr-integration.md.

# Stay on picolibc: CHIP's Kconfig implies newlib-nano, whose default heap
# setup dies pre-main on nRF52840 (bisected 2026-08-03); the Zephyr default
# libc works. (Also enforced as a hard `depends on` in
# components/matter/Kconfig, so a missing setting here fails loudly at
# configure time instead of silently at runtime.)
CONFIG_PICOLIBC=y

# Vanilla default is a 1 KB mbedTLS heap — the first real ECC operation
# (PSA persistent-key export for the SRP KEY record) dies with
# PSA_ERROR_INSUFFICIENT_MEMORY (-141) and the node never registers
# with the SRP server. Match the NCS reference sizing.
CONFIG_MBEDTLS_HEAP_SIZE=15360

# Memory sizing — vanilla Zephyr defaults (1 KB main stack, 0 B heap) are
# far below what the Matter stack needs; vendor SDKs raise these silently.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2560
CONFIG_HEAP_MEM_POOL_SIZE=15360

# Optimized M-profile P-256 driver (tf-psa-crypto p256-m): the generic
# ECC path needs ~3.2 s per SPAKE2+ step on the plain M33, which loses
# the race against the commissioner's PASE retransmission budget.
# (Speeds up PSA-routed ECDSA; CHIP's SPAKE2+ bypasses PSA and runs on
# mbedTLS ECP directly, hence the ASM switch below matters most there.)
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=y
# Bignum inner-loop assembly — off by default in vanilla Zephyr; without
# it SPAKE2+ (Pake1->Pake2) takes ~3.1 s and the matter.js commissioner
# aborts at its fixed ~3.3 s PASE probe budget first.
CONFIG_MBEDTLS_HAVE_ASM=y

# Keep builds lean by default: OTA requestor and the CHIP shell add
# flash/RAM most nodes don't need. Components/devices that want them
# override per build.
CONFIG_CHIP_OTA_REQUESTOR=n
CONFIG_CHIP_LIB_SHELL=n
