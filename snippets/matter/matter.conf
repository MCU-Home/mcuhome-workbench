# Matter (CHIP) runtime defaults: numeric/choice Kconfig values vanilla
# Zephyr ships too small (or off) for CHIP to run reliably. Apply with
# `-S matter`. Root causes: docs/design/matter-zephyr-integration.md.

# Stay on picolibc: CHIP's Kconfig implies newlib-nano, whose default heap
# setup dies pre-main on nRF52840 (bisected 2026-08-03); the Zephyr default
# libc works. (Also enforced as a hard `depends on` in
# components/matter/Kconfig, so a missing setting here fails loudly at
# configure time instead of silently at runtime.)
CONFIG_PICOLIBC=y

# Vanilla default is a 1 KB mbedTLS heap — the first real ECC operation
# (PSA persistent-key export for the SRP KEY record) dies with
# PSA_ERROR_INSUFFICIENT_MEMORY (-141) and the node never registers
# with the SRP server. Match the NCS reference sizing.
CONFIG_MBEDTLS_HEAP_SIZE=15360

# Memory sizing — vanilla Zephyr defaults (1 KB main stack, 0 B heap) are
# far below what the Matter stack needs; vendor SDKs raise these silently.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=15360

# --- Service-thread stacks ----------------------------------------------
#
# Everything below is a vanilla Zephyr default that nobody sized for
# Matter-over-Thread, let alone for Matter-over-Thread WHILE a 700 KiB
# BDX download runs into an external flash part and the report engine
# pushes attribute updates into a live subscription. That load profile
# first ran on 2026-08-08 and ended in a BusFault after ~4 minutes; the
# analysis could not name the faulting thread (no CONFIG_THREAD_NAME, no
# CONFIG_EXTRA_EXCEPTION_INFO — both now in snippets/debug-rtt) and could
# not rule out an out-of-bounds write inside one of these frames, which
# is the one corruption class the ARMv8-M stack guard does NOT catch:
# PSPLIM traps a stack that grows too deep, never a memcpy that runs off
# the end of a buffer sitting in a frame.
#
# These are therefore HEADROOM, not measurements. Every number is the
# vanilla default rounded up to the next power of two with at least 30%
# margin, kept in one place so that the high-water readout from the next
# instrumented run (CONFIG_INIT_STACKS, snippets/debug-rtt) can replace
# guesses with measurements one line at a time. Total cost over vanilla:
# about 8 KiB of RAM on a part that has 448 KiB.
#
# Not copied from the nRF Connect SDK: no NCS checkout is part of this
# workspace, and vendor numbers are a reference for MCUHome, never an
# authority. Where a number matches NCS practice that is stated; where it
# does not, the reasoning below is the whole justification.

# 3072 vanilla. The OpenThread task runs MLE, the mesh forwarder, IPv6
# reassembly, CoAP and the SRP client, and under BDX it is the thread
# every received frame passes through on its way to CHIP.
CONFIG_OPENTHREAD_THREAD_STACK_SIZE=6144

# 1500 / 1200 vanilla. The net RX and TX threads carry every packet
# between the OpenThread L2 and the UDP endpoints CHIP listens on. The
# defaults are Zephyr's generic ones, sized for a small IPv4 stack.
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_TX_STACK_SIZE=2048

# 2560 (MCUHome's own previous value, matching NCS Matter practice). The
# system workqueue now also carries the health watchdog feeder, the
# image-confirmation timer and the settings/NVS writes that a commissioned
# node makes while the network is up — none of which existed when 2560 was
# chosen.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# 8192 vanilla (CHIP's own default). This is the thread the whole OTA
# download runs on: BDX -> OtaImageProcessor::ProcessBlock -> flash_img ->
# stream_flash -> spi_nor -> the SPIM driver, a call chain that did not
# exist when CHIP picked 8192 and that is by some distance the deepest one
# in the product.
CONFIG_CHIP_TASK_STACK_SIZE=10240

# Optimized M-profile P-256 driver (tf-psa-crypto p256-m): the generic
# ECC path needs ~3.2 s per SPAKE2+ step on the plain M33, which loses
# the race against the commissioner's PASE retransmission budget.
# (Speeds up PSA-routed ECDSA; CHIP's SPAKE2+ bypasses PSA and runs on
# mbedTLS ECP directly, hence the ASM switch below matters most there.)
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=y
# Bignum inner-loop assembly — off by default in vanilla Zephyr; without
# it SPAKE2+ (Pake1->Pake2) takes ~3.1 s and the matter.js commissioner
# aborts at its fixed ~3.3 s PASE probe budget first.
CONFIG_MBEDTLS_HAVE_ASM=y

# Keep builds lean by default: the CHIP shell adds flash and RAM most
# nodes don't need.
CONFIG_CHIP_LIB_SHELL=n

# CONFIG_CHIP_OTA_REQUESTOR is deliberately NOT set here, in either
# direction. It used to be pinned to =n on the same "keep builds lean"
# reasoning, which was correct until Matter OTA existed and then became a
# trap: a snippet's EXTRA_CONF_FILE is merged AFTER the application's
# prj.conf, so this line silently overrode the =y that a class-A board's
# update scheme writes (mcuhome/registry.py), and the resulting image had
# MCUHome's image processor in it and no CHIP requestor behind it —
# built, linked, and would have failed on the bench. Caught in the
# verification build of the OTA block, 2026-08-08.
#
# The symbol's own Kconfig default is already n, so leaving it out has
# exactly the effect this line was meant to have, and lets the board's
# scheme turn it on. components/matter/CMakeLists.txt now refuses a build
# where one half of the pair is on and the other is not, in both
# directions, so this cannot go quiet again.

# Randomness: no silent downgrade.
#
# PSA reaches the entropy driver through
# zephyr/modules/mbedtls/zephyr_entropy.c. Its get_random_data() has an
# `allow_non_cs` branch: if entropy_get_entropy() returns an error, it
# calls sys_rand_get() and reports success. sys_rand_get() is not a
# CSPRNG — with CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR it degrades to
# k_cycle_get_32() when the driver fails — so every key the node then
# derives (PASE/CASE session keys, the operational key, SRP signatures)
# is predictable, and nothing in the log says so. Only this Kconfig
# symbol selects that branch:
#
#   ret = get_random_data(output, output_size,
#           IS_ENABLED(CONFIG_MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG_ALLOW_NON_CSPRNG));
#
# With it off, a driver error becomes PSA_ERROR_GENERIC_ERROR and the
# operation fails where it happens. A Matter node that cannot get
# randomness must not commission, it must break.
#
# This is an override, not a default: the nRF7002-DK board defconfig
# turns it on (zephyr/boards/nordic/nrf7002dk/nrf7002dk_nrf5340_cpuapp_defconfig,
# under a "# Enable RNG" comment), because upstream that board has no
# usable entropy driver at all. MCUHome ships one (drivers/entropy/), so
# the crutch goes.
CONFIG_MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG_ALLOW_NON_CSPRNG=n
