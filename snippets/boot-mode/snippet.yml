#
# Retention-based boot mode (GPREGRET) for boards whose upstream devicetree
# does not define one. Devicetree only — see README.md.

name: boot-mode

boards:
  nrf7002dk/nrf5340/cpuapp:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/nrf7002dk_nrf5340_cpuapp.overlay
  nrf52840dongle/nrf52840:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/nrf52840dongle_nrf52840.overlay
  nrf52840dongle/nrf52840/bare:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/nrf52840dongle_nrf52840.overlay
